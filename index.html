
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enterprise AI Data Assistant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: #f3f5fb; color: #182033;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      background: #fff; border-bottom: 1px solid #e5e7eb;
      padding: 17px 24px; display: flex; align-items: center; gap: 12px;
    }
    .logo {
      width: 44px; height: 44px; border-radius: 13px;
      background: #4f46e5; color: white; display: grid;
      place-items: center; font-size: 22px; font-weight: bold;
    }
    header h1 { font-size: 18px; margin: 0 0 5px; }
    header p { margin: 0; color: #64748b; font-size: 13px; }
    .status { margin-left: auto; font-size: 12px; color: #16834a; }
    main {
      width: 100%; max-width: 850px; margin: 0 auto;
      padding: 30px 18px 20px; flex: 1; display: flex;
      flex-direction: column; min-height: 0;
    }
    .welcome { text-align: center; margin: 24px 0; }
    .welcome h2 { font-size: 28px; margin-bottom: 10px; }
    .welcome p { color: #64748b; line-height: 1.6; }
    .suggestions {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 9px; margin: 20px 0 26px;
    }
    .suggestions button {
      border: 1px solid #dfe3ee; background: white;
      border-radius: 20px; padding: 10px 14px;
      cursor: pointer; color: #334155;
    }
    .suggestions button:hover { border-color: #4f46e5; }
    #chat { display: flex; flex-direction: column; gap: 16px; }
    .message { display: flex; gap: 10px; align-items: flex-start; }
    .message.user { justify-content: flex-end; }
    .bubble {
      max-width: 82%; padding: 13px 16px; border-radius: 16px;
      line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .assistant .bubble { background: white; border: 1px solid #e5e7eb; }
    .user .bubble { background: #4f46e5; color: white; }
    .avatar {
      width: 32px; height: 32px; border-radius: 10px;
      display: grid; place-items: center; flex-shrink: 0;
      background: #e0e7ff; color: #4338ca; font-size: 13px;
      font-weight: bold;
    }
    .user .avatar { display: none; }
    .composer {
      margin-top: auto; background: white; border: 1px solid #dfe3ee;
      border-radius: 18px; padding: 10px; display: flex;
      gap: 10px; box-shadow: 0 8px 28px #1725540c;
    }
    #question {
      flex: 1; border: 0; outline: 0; resize: none;
      font: inherit; padding: 11px; min-height: 44px;
      max-height: 130px;
    }
    #send {
      border: 0; border-radius: 12px; background: #4f46e5;
      color: white; padding: 0 19px; font-weight: bold;
      cursor: pointer;
    }
    #send:disabled { opacity: .55; cursor: wait; }
    .hint { text-align: center; color: #94a3b8; font-size: 12px; margin: 10px 0 0; }
    @media (max-width: 600px) {
      header { padding: 13px; }
      .status { display: none; }
      main { padding: 18px 12px; }
      .welcome h2 { font-size: 23px; }
      .bubble { max-width: 90%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">AI</div>
    <div>
      <h1>Enterprise AI Data Assistant</h1>
      <p>Ask questions about your sales data</p>
    </div>
    <div class="status">● AI Assistant</div>
  </header>

  <main>
    <section class="welcome" id="welcome">
      <h2>What would you like to know? 👋</h2>
      <p>Ask a question in plain English. I'll help you analyze your sales data.</p>
      <div class="suggestions">
        <button data-question="What is the total sales revenue?">💰 Total revenue</button>
        <button data-question="Which is the top product?">🏆 Top product</button>
        <button data-question="Show sales by region">🌎 Sales by region</button>
      </div>
    </section>

    <section id="chat" aria-live="polite"></section>

    <form class="composer" id="chatForm">
      <textarea id="question" rows="1" maxlength="1000"
        placeholder="Ask anything about your sales data..." required></textarea>
      <button id="send" type="submit">Send ➤</button>
    </form>
    <p class="hint">AI-generated answers may need verification. Don't enter confidential data.</p>
  </main>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("question");
    const send = document.getElementById("send");
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");

    function addMessage(text, role) {
      const row = document.createElement("div");
      row.className = "message " + role;

      if (role === "assistant") {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "AI";
        row.appendChild(avatar);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      row.appendChild(bubble);
      chat.appendChild(row);
      row.scrollIntoView({ behavior: "smooth", block: "end" });
      return row;
    }

    async function askQuestion(question) {
      const cleanQuestion = question.trim();
      if (!cleanQuestion || send.disabled) return;

      welcome.style.display = "none";
      addMessage(cleanQuestion, "user");
      input.value = "";
      send.disabled = true;
      send.textContent = "…";
      const loading = addMessage("Analyzing your question...", "assistant");

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: cleanQuestion })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || "The request could not be processed.");
        }
        loading.querySelector(".bubble").textContent =
          data.answer ?? "I couldn't generate an answer.";
      } catch (error) {
        loading.querySelector(".bubble").textContent =
          "Sorry, something went wrong: " + error.message +
          "\nPlease check the server logs and Gemini API configuration.";
      } finally {
        send.disabled = false;
        send.textContent = "Send ➤";
        input.focus();
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      askQuestion(input.value);
    });

    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    document.querySelectorAll("[data-question]").forEach(button => {
      button.addEventListener("click", () => {
        askQuestion(button.dataset.question);
      });
    });
  </script>
</body>
</html>
